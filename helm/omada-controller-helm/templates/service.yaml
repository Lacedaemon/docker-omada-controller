{{- $split := eq (include "omada-controller.servicesSplit" .) "true" -}}
{{- $webType := .Values.service.web.type | default .Values.service.type -}}
{{- $deviceType := .Values.service.device.type | default .Values.service.type -}}
{{- if not $split -}}
# Single merged Service (default): unless the split is explicitly opted into,
# the Web GUI and device ports are served by ONE Service exactly as in 1.7.x,
# so direct-IP/LoadBalancer installs keep a single IP.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omada-controller.fullname" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
  labels:
    {{- include "omada-controller.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ $webType }}
  ports:
  {{- include "omada-controller.serviceWebPorts" . }}
  {{- include "omada-controller.serviceDevicePorts" . }}
  selector:
    {{- include "omada-controller.selectorLabels" . | nindent 4 }}
{{- else -}}
{{- $webLabels := mustMerge (mustMerge (dict) .Values.service.labels) .Values.service.web.labels -}}
{{- $webAnnotations := mustMerge (mustMerge (dict) .Values.service.annotations) .Values.service.web.annotations -}}
{{- $deviceLabels := mustMerge (mustMerge (dict) .Values.service.labels) .Values.service.device.labels -}}
{{- $deviceAnnotations := mustMerge (mustMerge (dict) .Values.service.annotations) .Values.service.device.annotations -}}
{{- $deviceName := include "omada-controller.fullnameWithSuffix" (dict "fullname" (include "omada-controller.fullname" .) "suffix" "-device") -}}
# Web GUI Service: management portal and captive portal HTTP/HTTPS ports.
# It keeps the chart fullname so existing Ingress/HTTPRoute backends continue to
# resolve without any change to templates/ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omada-controller.fullname" . }}
  {{- with $webAnnotations }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
  labels:
    {{- include "omada-controller.labels" . | nindent 4 }}
    {{- with $webLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ $webType }}
  ports:
  {{- include "omada-controller.serviceWebPorts" . }}
  selector:
    {{- include "omada-controller.selectorLabels" . | nindent 4 }}
---
# Device Service: every port Omada devices themselves talk to the controller on
# (adoption, management, discovery, upgrades, transfer, rtty, monitoring).
apiVersion: v1
kind: Service
metadata:
  name: {{ $deviceName }}
  {{- with $deviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
  labels:
    {{- include "omada-controller.labels" . | nindent 4 }}
    {{- with $deviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ $deviceType }}
  ports:
  {{- include "omada-controller.serviceDevicePorts" . }}
  selector:
    {{- include "omada-controller.selectorLabels" . | nindent 4 }}
{{- end }}
